  * {box-sizing: border-box}

/* Slideshow container */
.slideshow-container {
  max-width: 1000px;
  position: relative;
  margin: auto;
  overflow: hidden;
}

/* Next & previous buttons */
.prev, .next {
  cursor: pointer;
  position: absolute;
  top: 50%;
  width: auto;
  padding: 16px;
  margin-top: -22px;
  color: white;
  font-weight: bold;
  font-size: 18px;
  transition: 0.6s ease;
  border-radius: 0 3px 3px 0;
  user-select: none;
}

/* Position the "next button" to the right */
.next {
  right: 0;
  border-radius: 3px 0 0 3px;
}

/* On hover, add a black background color with a little bit see-through */
.prev:hover, .next:hover {
  background-color: rgba(0,0,0,0.8);
}

/* Caption text */
.text {
  color: #f2f2f2;
  font-size: 15px;
  padding: 8px 12px;
  position: absolute;
  bottom: 8px;
  width: 100%;
  text-align: center;
}

/* Number text (1/3 etc) */
.numbertext {
  color: #f2f2f2;
  font-size: 12px;
  padding: 8px 12px;
  position: absolute;
  top: 0;
}

/* The dots/bullets/indicators */
.dot {
  cursor: pointer;
  height: 15px;
  width: 15px;
  margin: 0 2px;
  background-color: #bbb;
  border-radius: 50%;
  display: inline-block;
  transition: background-color 0.6s ease;
}

.active, .dot:hover {
  background-color: #717171;
}
  

/* The horizontal track that moves */
.slides-track {
  display: flex;             /* lay slides in a row */
  transition: transform 0.6s ease;  /* smooth slide */
}

/* Each slide takes full width of the container */
.mySlide {
  min-width: 100%;
  box-sizing: border-box;
  position: relative;
}

.mySlide img {
  width: 100%;
  display: block;
  border-radius: 25px;       /* matches your style */
}

<!--  W3Schools and ChatGPT Assisted Slideshow -->
 <div class="slideshow-container">

  <div class="slides-track">
    <div class="mySlide">
      <div class="numbertext">1 / 3</div>
      <img src="Mel's Diner Rebrand-1.png" alt="Mel's Diner Rebranding Package Title Page">
    </div>

    <div class="mySlide">
      <div class="numbertext">2 / 3</div>
      <img src="Mel's Diner Rebrand-2.png" alt="Mel's Diner Interior">
    </div>

    <div class="mySlide">
      <div class="numbertext">3 / 3</div>
      <img src="Mel's Diner Rebrand-3.png" alt="Mel's Diner Social Media">
    </div>
  </div>

  <a class="prev" onclick="plusSlides(-1)">❮</a>
  <a class="next" onclick="plusSlides(1)">❯</a>

</div>
<br>

<div style="text-align:center">
  <span class="dot" onclick="currentSlide(1)"></span> 
  <span class="dot" onclick="currentSlide(2)"></span> 
  <span class="dot" onclick="currentSlide(3)"></span> 
</div>

<script>
let slideIndex = 0;

const track = document.querySelector('.slides-track');
const slides = document.querySelectorAll('.mySlide');
const dots = document.getElementsByClassName('dot');

showSlide(slideIndex);

function plusSlides(n) {
  showSlide(slideIndex + n);
}

function currentSlide(n) {
  showSlide(n - 1); // dots still use 1,2,3
}

function showSlide(n) {
  const total = slides.length;

  if (n >= total) n = 0;
  if (n < 0) n = total - 1;

  slideIndex = n;

  // Move the track horizontally
  const offset = -slideIndex * 100;
  track.style.transform = `translateX(${offset}%)`;

  // Update dots
  for (let i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  if (dots[slideIndex]) {
    dots[slideIndex].className += " active";
  }
}
  
</script>
